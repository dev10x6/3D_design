name: Deploy to Vercel

# Every push to main that touches the site goes to production. Pull requests
# get a preview deployment instead, so a change can be checked before it lands.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # There is no build step, so the only thing that can break silently is a
      # syntax error in a module or an import path that does not exist. Both
      # would ship a blank page, so check them before deploying.
      - name: Check module syntax
        run: |
          for f in app/src/*.js; do
            node --check "$f"
            echo "ok  $f"
          done

      - name: Check import specifiers resolve
        run: |
          # Map the bare specifiers from the import map to vendored files.
          fail=0
          for spec in $(grep -rhoE "from '(three[^']*)'" app/src | sed "s/from '//; s/'//" | sort -u); do
            case "$spec" in
              three) file="app/vendor/build/three.module.js" ;;
              three/addons/*) file="app/vendor/examples/jsm/${spec#three/addons/}" ;;
              *) echo "unexpected specifier: $spec"; fail=1; continue ;;
            esac
            if [ -f "$file" ]; then
              echo "ok  $spec -> $file"
            else
              echo "MISSING  $spec -> $file"
              fail=1
            fi
          done
          exit $fail

      - name: Check entry points exist
        run: |
          test -f index.html       && echo "ok  index.html"
          test -f app/index.html   && echo "ok  app/index.html"
          test -f app/favicon.png  && echo "ok  app/favicon.png"

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    # Fork pull requests get no secrets, so skip rather than fail red.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fail fast if Vercel secrets are missing
        run: |
          missing=0
          [ -n "$VERCEL_ORG_ID" ]     || { echo "::error::VERCEL_ORG_ID secret is not set"; missing=1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::VERCEL_PROJECT_ID secret is not set"; missing=1; }
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || { echo "::error::VERCEL_TOKEN secret is not set"; missing=1; }
          exit $missing

      - name: Install Vercel CLI
        run: npm install --global vercel@66.5.0

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ github.event_name == 'pull_request' && '' || '--prod' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\nPreview deployment for ${context.sha.slice(0, 7)}: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
